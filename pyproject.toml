[project]
name = "btb"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "tomli-w",
    "pyyaml",
    "huggingface-hub",
]

[project.optional-dependencies]
reporting = ["numpy>=2,<3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "scripts"}
packages = ["btb"]
py-modules = ["btb_scoring"]
